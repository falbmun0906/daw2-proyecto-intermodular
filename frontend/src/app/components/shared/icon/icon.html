@if (isSocialIcon) {
  <img
    [src]="iconPath"
    [attr.width]="size"
    [attr.height]="size"
    [attr.alt]="name"
    class="icon icon--social"
  />
} @else {
  <img
    [src]="iconPath"
    [attr.width]="size"
    [attr.height]="size"
    [attr.alt]="name"
    class="icon icon--phosphor"
  />
}
