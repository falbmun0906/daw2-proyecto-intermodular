<div class="accordion" #accordionContainer>
  @for (item of items; track item.id) {
    <div class="accordion__item" [class.accordion__item--expanded]="isExpanded(item.id)" [class.accordion__item--disabled]="item.disabled">
      <!-- Header / Botón -->
      <button
        class="accordion__header"
        [attr.data-accordion-item-id]="item.id"
        [attr.id]="'header-' + item.id"
        [disabled]="item.disabled"
        (click)="toggle(item.id)"
      >
        <span class="accordion__icon">{{ getIcon(item.id) }}</span>
        <span class="accordion__title">{{ item.title }}</span>
      </button>

      <!-- Contenido -->
      <div
        class="accordion__content"
        [attr.data-accordion-content-id]="item.id"
        [class.accordion__content--expanded]="isExpanded(item.id)"
      >
        <div class="accordion__content-inner">
          {{ item.content }}
        </div>
      </div>
    </div>
  }
</div>
