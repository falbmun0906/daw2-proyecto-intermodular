<form class="register-form" [formGroup]="registerForm" (submit)="onSubmit($event)">
  <h1 class="register-form__title">Registro</h1>

  <fieldset class="register-form__fieldset">
    <legend class="visually-hidden">Datos personales</legend>

    <app-form-input
      type="text"
      label="Nombre"
      name="nombre"
      placeholder="Nombre"
      icon="👤"
      [required]="true"
      formControlName="nombre"
      [errorMessage]="getErrorMessage('nombre')"
      [hasError]="!!(nombre?.invalid && nombre?.touched)"
      class="register-form__field"
    />

    <app-form-input
      type="text"
      label="Apellido"
      name="apellido"
      placeholder="Apellido"
      icon="abc"
      [required]="true"
      formControlName="apellido"
      [errorMessage]="getErrorMessage('apellido')"
      [hasError]="!!(apellido?.invalid && apellido?.touched)"
      class="register-form__field"
    />

    <app-form-input
      type="email"
      label="Email"
      name="email"
      placeholder="Email"
      icon="✉"
      [required]="true"
      formControlName="email"
      [errorMessage]="getErrorMessage('email')"
      [hasError]="!!(email?.invalid && email?.touched && !email?.pending)"
      class="register-form__field"
    />

    <app-form-input
      type="password"
      label="Contraseña"
      name="password"
      placeholder="Contraseña"
      icon="🔒"
      [required]="true"
      formControlName="password"
      [errorMessage]="getErrorMessage('password')"
      [hasError]="!!(password?.invalid && password?.touched)"
      class="register-form__field"
    />

    <app-form-input
      type="password"
      label="Confirmar contraseña"
      name="confirmPassword"
      placeholder="Confirmar contraseña"
      icon="🔒"
      [required]="true"
      formControlName="confirmPassword"
      [errorMessage]="hasPasswordMismatch() ? 'Las contraseñas no coinciden' : getErrorMessage('confirmPassword')"
      [hasError]="!!((confirmPassword?.invalid || hasPasswordMismatch()) && confirmPassword?.touched)"
      class="register-form__field"
    />
  </fieldset>

  <div class="register-form__options">
    <app-form-checkbox
      label="Me gustaría recibir información sobre novedades por e-mail"
      name="newsletter"
      formControlName="newsletter"
    />
  </div>

  <app-button
    type="submit"
    variant="primary"
    size="md"
    [disabled]="registerForm.invalid || isSubmitting"
    class="register-form__submit">
    {{ isSubmitting ? 'Registrando...' : 'Registrarse' }}
  </app-button>

  @if (generalError) {
    <div class="register-form__general-error">{{ generalError }}</div>
  }

  <p class="register-form__login-link">
    ¿Ya estás registrado? <a routerLink="/login">Inicia sesión</a>
  </p>
</form>
