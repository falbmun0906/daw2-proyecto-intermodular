<div
  class="form-input"
  [class.form-input--error]="hasError"
  [class.form-input--success]="hasSuccess"
  [class.form-input--disabled]="disabled"
>
  <!-- Label -->
  <label
    class="form-input__label"
    [for]="inputId"
  >
    {{ label }}
    @if (required) {
      <span class="form-input__required" aria-label="Campo requerido">*</span>
    }
  </label>

  <!-- Input wrapper con icono opcional -->
  <div class="form-input__wrapper">
    <!-- Icono opcional -->
    @if (icon) {
      <span class="form-input__icon" aria-hidden="true">
        @if (isLucideIcon(icon)) {
          <app-icon [name]="icon" [size]="20"></app-icon>
        } @else {
          {{ icon }}
        }
      </span>
    }

    <!-- Input o Textarea -->
    @if (type !== 'textarea') {
      <input
        class="form-input__field"
        [class.form-input__field--with-icon]="icon"
        [class.form-input__field--focused]="isFocused"
        [class.form-input__field--hovered]="isHovered"
        [class.form-input__field--error]="hasError"
        [class.form-input__field--valid]="hasSuccess"
        [id]="inputId"
        [type]="type"
        [name]="name"
        [placeholder]="placeholder"
        [required]="required"
        [disabled]="disabled"
        [attr.aria-describedby]="ariaDescribedBy"
        [attr.aria-invalid]="hasError"
        [(ngModel)]="value"
        (blur)="onBlur()"
        (focus)="onFocus()"
        (input)="onInput($event)"
        (keydown)="onKeyDown($event)"
        (keyup)="onKeyUp($event)"
        (mouseenter)="onMouseEnter($event)"
        (mouseleave)="onMouseLeave($event)"
      />
    } @else {
      <textarea
        class="form-input__field form-input__field--textarea"
        [class.form-input__field--focused]="isFocused"
        [class.form-input__field--hovered]="isHovered"
        [class.form-input__field--error]="hasError"
        [class.form-input__field--valid]="hasSuccess"
        [id]="inputId"
        [name]="name"
        [placeholder]="placeholder"
        [required]="required"
        [disabled]="disabled"
        [attr.aria-describedby]="ariaDescribedBy"
        [attr.aria-invalid]="hasError"
        [(ngModel)]="value"
        (blur)="onBlur()"
        (focus)="onFocus()"
        (input)="onInput($event)"
        (keydown)="onKeyDown($event)"
        (keyup)="onKeyUp($event)"
        (mouseenter)="onMouseEnter($event)"
        (mouseleave)="onMouseLeave($event)"
      ></textarea>
    }
  </div>

  <!-- Texto de ayuda -->
  @if (helpText && !hasError && !hasSuccess) {
    <p
      class="form-input__help-text"
      [id]="inputId + '-help'"
    >
      {{ helpText }}
    </p>
  }

  <!-- Mensaje de error -->
  @if (hasError && errorMessage) {
    <p
      class="form-input__error-message"
      [id]="inputId + '-error'"
      role="alert"
    >
      {{ errorMessage }}
    </p>
  }

  <!-- Mensaje de éxito -->
  @if (hasSuccess && successMessage) {
    <p
      class="form-input__success-message"
      [id]="inputId + '-success'"
      role="status"
    >
      {{ successMessage }}
    </p>
  }
</div>
