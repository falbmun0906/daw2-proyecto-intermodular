<article class="sugerencia-card">
  <img
    class="sugerencia-card__image"
    src="assets/sugerencia.png"
    alt="ilustración de sugerencia"
    loading="lazy">
  <h2 class="sugerencia-card__id">
    <span>ID: </span> {{ id }}
  </h2>
  <h3 class="sugerencia-card__asunto">
    <span>Asunto: </span>{{ asunto }}
  </h3>
  <p class="sugerencia-card__descripcion">
    <span>Descripción: </span>{{ descripcion }}
  </p>
</article>
