<article class="pending-product" [style.background-color]="color">
  <div class="pending-product__content">
    <h3 class="pending-product__name">{{ name }}</h3>
    <p class="pending-product__urgency">Urgencia: {{ urgency }}</p>
    <p class="pending-product__days">{{ daysRemaining }} días</p>
  </div>
  <button
    class="pending-product__done-btn"
    (click)="onMarkDone()"
    aria-label="Marcar como visto">
    <app-icon name="eye" [size]="18"></app-icon>
    Marcar como visto
  </button>
</article>
