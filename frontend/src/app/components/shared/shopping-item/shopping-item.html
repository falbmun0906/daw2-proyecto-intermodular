<article class="shopping-item">
  <img
    [src]="imageSrc"
    [alt]="name"
    class="shopping-item__image"
    loading="lazy"
  />
  <div class="shopping-item__content">
    <h4 class="shopping-item__name">{{ name }}</h4>
    <p class="shopping-item__quantity">{{ quantity }}</p>
  </div>
  <div class="shopping-item__actions">
    <button
      type="button"
      class="shopping-item__btn shopping-item__btn--mark"
      (click)="onMarkAsComprado()"
      title="Marcar como comprado">
      ✓
    </button>
    <button
      type="button"
      class="shopping-item__btn shopping-item__btn--delete"
      (click)="onDelete()"
      title="Eliminar">
      ✕
    </button>
  </div>
</article>
