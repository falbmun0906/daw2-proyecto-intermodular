<nav class="pagination" role="navigation" aria-label="Paginación">
  <!-- Información de resultados -->
  @if (totalItems > 0) {
    <div class="pagination__info">
      <p class="pagination__text">
        Mostrando <strong>{{ startItem }}</strong> - <strong>{{ endItem }}</strong> de <strong>{{ totalItems }}</strong> resultados
      </p>
    </div>
  }

  <!-- Controles de paginación -->
  <ul class="pagination__list">
    <!-- Botón Primera página -->
    @if (showFirstLast) {
      <li class="pagination__item">
        <button
          class="pagination__button pagination__button--first"
          type="button"
          [disabled]="isFirstPage"
          (click)="goToFirstPage()"
          aria-label="Primera página"
        >
          <span aria-hidden="true">«</span>
        </button>
      </li>
    }

    <!-- Botón Anterior -->
    @if (showPrevNext) {
      <li class="pagination__item">
        <button
          class="pagination__button pagination__button--prev"
          type="button"
          [disabled]="isFirstPage"
          (click)="goToPreviousPage()"
          aria-label="Página anterior"
        >
          <span aria-hidden="true">‹</span>
        </button>
      </li>
    }

    <!-- Páginas visibles -->
    @for (page of visiblePages; track page) {
      <li class="pagination__item">
        <button
          class="pagination__button pagination__button--page"
          [class.pagination__button--active]="page === currentPage"
          type="button"
          [attr.aria-label]="'Página ' + page"
          [attr.aria-current]="page === currentPage ? 'page' : null"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      </li>
    }

    <!-- Botón Siguiente -->
    @if (showPrevNext) {
      <li class="pagination__item">
        <button
          class="pagination__button pagination__button--next"
          type="button"
          [disabled]="isLastPage"
          (click)="goToNextPage()"
          aria-label="Página siguiente"
        >
          <span aria-hidden="true">›</span>
        </button>
      </li>
    }

    <!-- Botón Última página -->
    @if (showFirstLast) {
      <li class="pagination__item">
        <button
          class="pagination__button pagination__button--last"
          type="button"
          [disabled]="isLastPage"
          (click)="goToLastPage()"
          aria-label="Última página"
        >
          <span aria-hidden="true">»</span>
        </button>
      </li>
    }
  </ul>
</nav>
