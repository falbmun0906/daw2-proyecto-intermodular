<div class="form-radio-group" [class.form-radio-group--error]="hasError" [class.form-radio-group--disabled]="disabled" [class.form-radio-group--inline]="inline">
  <!-- Group label -->
  <fieldset class="form-radio-group__fieldset">
    <legend class="form-radio-group__legend">
      {{ label }}
      @if (required) {
        <span class="form-radio-group__required" aria-label="obligatorio">*</span>
      }
    </legend>

    <!-- Radio options -->
    <div class="form-radio-group__options" [attr.aria-describedby]="ariaDescribedBy">
      @for (option of options; track option.value; let i = $index) {
        <div class="form-radio-group__option">
          <input
            type="radio"
            [id]="getRadioId(i)"
            [name]="name"
            [value]="option.value"
            [required]="required"
            [disabled]="disabled || option.disabled"
            [attr.aria-invalid]="hasError"
            [attr.aria-required]="required"
            [checked]="value === option.value"
            (change)="onRadioChange($event)"
            class="form-radio-group__input"
          />

          <label [for]="getRadioId(i)" class="form-radio-group__label">
            {{ option.label }}
          </label>
        </div>
      }
    </div>
  </fieldset>

  <!-- Help text -->
  @if (helpText && !hasError) {
    <p [id]="groupId + '-help'" class="form-radio-group__help">
      {{ helpText }}
    </p>
  }

  <!-- Error message -->
  @if (hasError && errorMessage) {
    <p [id]="groupId + '-error'" class="form-radio-group__error" role="alert">
      {{ errorMessage }}
    </p>
  }
</div>
