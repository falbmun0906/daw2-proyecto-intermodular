<span
  class="badge"
  [class.badge--primary]="variant === 'primary'"
  [class.badge--secondary]="variant === 'secondary'"
  [class.badge--success]="variant === 'success'"
  [class.badge--error]="variant === 'error'"
  [class.badge--warning]="variant === 'warning'"
  [class.badge--info]="variant === 'info'"
  [class.badge--neutral]="variant === 'neutral'"
  [class.badge--sm]="size === 'sm'"
  [class.badge--md]="size === 'md'"
  [class.badge--lg]="size === 'lg'"
  [class.badge--dot]="dot"
  [class.badge--rounded]="rounded"
  role="status"
  [attr.aria-label]="label || count"
>
  @if (dot) {
    <!-- Badge de punto (sin texto) -->
    <span class="visually-hidden">{{ label || 'Notificación' }}</span>
  } @else if (count) {
    <!-- Badge con contador -->
    {{ count }}
  } @else {
    <!-- Badge con texto o contenido proyectado -->
    {{ label }}
    <ng-content></ng-content>
  }
</span>
