<form class="login-form" [formGroup]="loginForm" (submit)="onSubmit($event)">
  <h1 class="login-form__title">Iniciar sesión</h1>

  <fieldset class="login-form__fieldset">
    <legend class="visually-hidden">Credenciales de acceso</legend>

    <app-form-input
      type="email"
      label="Email"
      name="email"
      placeholder="tu@email.com"
      icon="✉"
      [required]="true"
      formControlName="email"
      [errorMessage]="getErrorMessage('email')"
      [hasError]="!!(email?.invalid && email?.touched)"
      class="login-form__field"
    />

    <app-form-input
      type="password"
      label="Contraseña"
      name="password"
      placeholder="Tu contraseña"
      icon="🔒"
      [required]="true"
      formControlName="password"
      [errorMessage]="getErrorMessage('password')"
      [hasError]="!!(password?.invalid && password?.touched)"
      class="login-form__field"
    />
  </fieldset>

  <div class="login-form__options">
    <app-form-checkbox
      label="Recuérdame"
      name="rememberMe"
      formControlName="rememberMe"
    />

    <app-button
      type="submit"
      variant="secondary"
      size="md"
      [disabled]="loginForm.invalid || isSubmitting"
      class="login-form__submit">
      {{ isSubmitting ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </app-button>
  </div>

  @if (generalError) {
    <div class="login-form__general-error">{{ generalError }}</div>
  }

  <p class="login-form__register-link">
    ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
  </p>

  <div class="login-form__divider">
    <span class="login-form__divider-line"></span>
    <span class="login-form__divider-text">o</span>
    <span class="login-form__divider-line"></span>
  </div>

  <div class="login-form__social">
    <app-button
      variant="secondary"
      size="md"
      class="login-form__social-btn"
      (buttonClick)="onSocialLogin('google')">
      <img src="assets/icons/google.svg" alt="" class="login-form__social-icon" />
      Iniciar con Google
    </app-button>

    <app-button
      variant="secondary"
      size="md"
      class="login-form__social-btn"
      (buttonClick)="onSocialLogin('facebook')">
      <img src="assets/icons/facebook.svg" alt="" class="login-form__social-icon" />
      Iniciar con Facebook
    </app-button>

    <app-button
      variant="secondary"
      size="md"
      class="login-form__social-btn"
      (buttonClick)="onSocialLogin('x')">
      <img src="assets/icons/x.svg" alt="" class="login-form__social-icon" />
      Iniciar con X
    </app-button>
  </div>
</form>
