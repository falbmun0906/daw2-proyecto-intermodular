<form class="login-form" [formGroup]="loginForm" (submit)="onSubmit($event)">
  <h1 class="login-form__title">Iniciar sesión</h1>

  <!-- Fieldset: Credenciales de acceso -->
  <fieldset class="login-form__fieldset">
    <legend class="visually-hidden">Credenciales de acceso</legend>

    <!-- Email -->
    <div class="login-form__field">
      <label class="login-form__label" for="email">
        Email <span class="login-form__required">*</span>
      </label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="login-form__input"
        [class.login-form__input--error]="email?.invalid && email?.touched"
        [class.login-form__input--valid]="email?.valid && email?.touched"
        placeholder="tu@email.com"
        (focus)="onFieldFocus()"
      />
      @if (email?.invalid && email?.touched) {
        <span class="login-form__error">{{ getErrorMessage('email') }}</span>
      }
    </div>

    <!-- Password -->
    <div class="login-form__field">
      <label class="login-form__label" for="password">
        Contraseña <span class="login-form__required">*</span>
      </label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="login-form__input"
        [class.login-form__input--error]="password?.invalid && password?.touched"
        [class.login-form__input--valid]="password?.valid && password?.touched"
        placeholder="Tu contraseña"
        (focus)="onFieldFocus()"
      />
      @if (password?.invalid && password?.touched) {
        <span class="login-form__error">{{ getErrorMessage('password') }}</span>
      }
    </div>
  </fieldset>

  <!-- Recordar sesión -->
  <div class="login-form__options">
    <label class="login-form__checkbox-label">
      <input
        type="checkbox"
        formControlName="rememberMe"
        class="login-form__checkbox"
      />
      <span>Recuérdame</span>
    </label>
  </div>

  <!-- Error general -->
  @if (generalError) {
    <div class="login-form__general-error">{{ generalError }}</div>
  }

  <!-- Botón submit -->
  <div class="login-form__actions">
    <button
      type="submit"
      class="login-form__submit"
      [disabled]="loginForm.invalid || isSubmitting"
    >
      {{ isSubmitting ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </button>
  </div>

  <!-- Link a registro -->
  <p class="login-form__register-link">
    ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
  </p>
</form>
