<section class="recipes-hero">
  <div class="recipes-hero__background"></div>

  <div class="recipes-hero__content">
    <!-- Breadcrumbs arriba a la izquierda con variante hero -->
    <div class="recipes-hero__breadcrumbs">
      <app-breadcrumbs [items]="config.breadcrumbItems" variant="hero"></app-breadcrumbs>
    </div>

    <!-- Título a la izquierda y Buscador a la derecha en la base -->
    <div class="recipes-hero__footer">
      <h1 class="recipes-hero__title">{{ config.title }}</h1>

      <app-form-input
        type="text"
        [placeholder]="config.searchPlaceholder || 'Buscar receta'"
        [icon]="'search'"
        [(ngModel)]="searchQuery"
        (inputChange)="onSearchChange()"
        class="recipes-hero__search form-input--search"
      />
    </div>
  </div>
</section>
