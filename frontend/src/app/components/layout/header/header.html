<header class="site-header" aria-label="Cabecera principal">
  <!-- Logo -->
  <section class="site-header__branding">
    <a
      class="site-header__logo"
      routerLink="/"
      aria-label="Ir a la página de inicio de Desp[i]lensa"
    >
      <span class="site-header__logo-text">Desp[i]ensa</span>
    </a>
  </section>

  <!-- Bloque derecho -->
  <section class="site-header__right">
    <!-- Theme switch -->
    <div class="site-header__theme-toggle">
      <label class="site-header__theme-switch" aria-label="Cambiar tema">
        <input
          type="checkbox"
          [checked]="isDarkTheme()"
          (change)="onThemeChange($event)"
          aria-label="Alternar tema claro y oscuro"
        />
        <span class="site-header__slider"></span>
      </label>
    </div>

    <!-- Navegación -->
    <nav class="site-header__nav" aria-label="Navegación principal">
      <!-- Botón hamburguesa controlado por Angular -->
      <button
        class="site-header__nav-toggle-btn"
        [class.site-header__nav-toggle-btn--open]="isMenuOpen"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navegación"
      >
        <span class="site-header__hamburger-line"></span>
        <span class="site-header__hamburger-line"></span>
        <span class="site-header__hamburger-line"></span>
      </button>

      <ul
        class="site-header__nav-list"
        [class.site-header__nav-list--open]="isMenuOpen"
      >
        @if (variant === 'dashboard') {
          @for (link of getNavLinks(); track link.label) {
            <li><a class="site-header__nav-link" [routerLink]="link.routerLink" (click)="closeMenu()">{{ link.label }}</a></li>
          }
        } @else {
          <li><a class="site-header__nav-link" routerLink="/">Inicio</a></li>
          <li><a class="site-header__nav-link" routerLink="/style-guide">Style Guide</a></li>
          <li><a class="site-header__nav-link" routerLink="/recetas">Recetas</a></li>
          <li><button class="site-header__nav-link" (click)="onMiDespensaClick()">Mi despensa</button></li>
        }
      </ul>
    </nav>
  </section>
</header>
