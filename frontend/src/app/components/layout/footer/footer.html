<footer class="site-footer" aria-label="Pie de página">
  <div class="site-footer__container">
    <!-- Grid: 3 columnas -->
    <div class="site-footer__grid">

      <!-- Columna 1: Redes Sociales -->
      <section class="site-footer__section" aria-label="Redes sociales">
        <ul class="site-footer__social-list">
          <li class="site-footer__social-item">
            <a class="site-footer__social-link" href="#" aria-label="YouTube" rel="noopener noreferrer" title="YouTube">
              <app-icon name="youtube-logo" [size]="32"></app-icon>
            </a>
          </li>
          <li class="site-footer__social-item">
            <a class="site-footer__social-link" href="#" aria-label="Pinterest" rel="noopener noreferrer" title="Pinterest">
              <app-icon name="pinterest-logo" [size]="32"></app-icon>
            </a>
          </li>
          <li class="site-footer__social-item">
            <a class="site-footer__social-link" href="#" aria-label="X (Twitter)" rel="noopener noreferrer" title="X">
              <app-icon name="x-logo" [size]="32"></app-icon>
            </a>
          </li>
          <li class="site-footer__social-item">
            <a class="site-footer__social-link" href="#" aria-label="TikTok" rel="noopener noreferrer" title="TikTok">
              <app-icon name="tiktok-logo" [size]="32"></app-icon>
            </a>
          </li>
          <li class="site-footer__social-item">
            <a class="site-footer__social-link" href="#" aria-label="Facebook" rel="noopener noreferrer" title="Facebook">
              <app-icon name="facebook-logo" [size]="32"></app-icon>
            </a>
          </li>
          <li class="site-footer__social-item">
            <a class="site-footer__social-link" href="#" aria-label="Instagram" rel="noopener noreferrer" title="Instagram">
              <app-icon name="instagram-logo" [size]="32"></app-icon>
            </a>
          </li>
        </ul>
      </section>

      <!-- Columna 2: Desp[i]ensa + Enlaces -->
      <section class="site-footer__section" aria-labelledby="brand-heading">
        <h2 id="brand-heading" class="site-footer__title">Desp[i]ensa</h2>
        <nav class="site-footer__nav">
          <a class="site-footer__link" routerLink="/acerca">Acerca de nosotros</a>
          <a class="site-footer__link" routerLink="/terminos">Términos y condiciones</a>
          <a class="site-footer__link" routerLink="/privacidad">Política de privacidad</a>
        </nav>
      </section>

      <!-- Columna 3: Soporte + Enlaces -->
      <section class="site-footer__section" aria-labelledby="support-heading">
        <h3 id="support-heading" class="site-footer__title">Soporte</h3>
        <nav class="site-footer__nav">
          <a class="site-footer__link" routerLink="/cookies">Política de Cookies</a>
          <a class="site-footer__link" routerLink="/faq">Preguntas Frecuentes (FAQ)</a>
          <a class="site-footer__link" routerLink="/contacto">Contacto</a>
        </nav>
      </section>

    </div>

    <!-- Divisor muy fino -->
    <div class="site-footer__divider"></div>

    <!-- Copyright -->
    <div class="site-footer__bottom">
      <p class="site-footer__copyright">© {{ currentYear }} Desp[i]ensa. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>
