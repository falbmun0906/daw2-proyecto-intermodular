<aside class="app-sidebar" [class.app-sidebar--collapsed]="isCollapsed">
<div class="app-sidebar__header">
    <h2 class="app-sidebar__title">Mi cocina</h2>
  </div>

  <hr class="app-sidebar__divider">

  <nav class="app-sidebar__nav">
    @for (item of items; track item.id) {
      <button
        class="app-sidebar__nav-button"
        [class.app-sidebar__nav-button--active]="item.active"
        (click)="onLinkClick(item.id)">
        <span class="app-sidebar__nav-indent"></span>
        <app-icon [name]="item.icon" class="app-sidebar__nav-icon"></app-icon>
        <span class="app-sidebar__nav-text">{{ item.label }}</span>
      </button>
    }
  </nav>

  <button
    class="app-sidebar__toggle"
    (click)="onToggle()"
    [attr.aria-label]="isCollapsed ? 'Abrir menú' : 'Cerrar menú'">
    <app-icon [name]="isCollapsed ? 'caret-right' : 'caret-left'"></app-icon>
  </button>
</aside>

<!-- Overlay para cerrar sidebar en mobile -->
<div
  class="app-sidebar-overlay"
  [class.app-sidebar-overlay--visible]="!isCollapsed && isMobile"
  (click)="onClose()"
  aria-hidden="true"
></div>
