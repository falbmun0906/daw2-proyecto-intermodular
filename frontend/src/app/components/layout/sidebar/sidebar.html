<aside class="app-sidebar" [class.app-sidebar--open]="isOpen" aria-label="Navegación secundaria">
  <h2 class="app-sidebar__title">Mi cocina</h2>

  <nav class="app-sidebar__nav" aria-label="Menú de Mi cocina">
    <ul class="app-sidebar__nav-list">
      <li class="app-sidebar__nav-item">
        <a
          class="app-sidebar__nav-link"
          [class.app-sidebar__nav-link--active]="activeRoute === 'resumen'"
          routerLink="/mi-cocina/resumen"
          (click)="onLinkClick()"
        >
          <span class="app-sidebar__nav-icon" aria-hidden="true">📊</span>
          Resumen
        </a>
      </li>
      <li class="app-sidebar__nav-item">
        <a
          class="app-sidebar__nav-link"
          [class.app-sidebar__nav-link--active]="activeRoute === 'despensa'"
          routerLink="/mi-cocina/despensa"
          (click)="onLinkClick()"
        >
          <span class="app-sidebar__nav-icon" aria-hidden="true">🏪</span>
          Despensa
        </a>
      </li>
      <li class="app-sidebar__nav-item">
        <a
          class="app-sidebar__nav-link"
          [class.app-sidebar__nav-link--active]="activeRoute === 'planificador'"
          routerLink="/mi-cocina/planificador"
          (click)="onLinkClick()"
        >
          <span class="app-sidebar__nav-icon" aria-hidden="true">📅</span>
          Planificador
        </a>
      </li>
      <li class="app-sidebar__nav-item">
        <a
          class="app-sidebar__nav-link"
          [class.app-sidebar__nav-link--active]="activeRoute === 'lista'"
          routerLink="/mi-cocina/lista"
          (click)="onLinkClick()"
        >
          <span class="app-sidebar__nav-icon" aria-hidden="true">📝</span>
          Lista
        </a>
      </li>
    </ul>
  </nav>

  <button
    class="app-sidebar__close-button"
    type="button"
    (click)="onClose()"
    aria-label="Cerrar menú lateral"
  >
    ←
  </button>
</aside>

<!-- Overlay para cerrar sidebar en mobile -->
<div
  class="app-sidebar-overlay"
  [class.app-sidebar-overlay--visible]="isOpen"
  (click)="onClose()"
  aria-hidden="true"
></div>
