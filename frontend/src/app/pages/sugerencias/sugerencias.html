<section class="sugerencias-page">
  <header class="sugerencias-page__header">
    <div class="sugerencias-page__header-container">
      <h1 class="sugerencias-page__header-title">
        Sugerencias
      </h1>
      <img
        class="sugerencias-page__header-img"
        src="assets/image.png"
        alt="imagen principal de la sección de sugerencias"
        loading="eager">
    </div>
    <p class="sugerencias-page__description">
      ¡Nos encantaría escuchar tus ideas! Envíanos tus sugerencias para que podamos hacer de Desp[i]ensa una herramienta aún mejor para ti.
    </p>
  </header>

  <div class="sugerencias-page__sugerencias">
    @for (sugerencia of mockSugerencias; track sugerencia) {
      <app-sugerencia-card
        [id]="sugerencia.id"
        [asunto]="sugerencia.asunto"
        [descripcion]="sugerencia.descripcion">
      </app-sugerencia-card>
    }
  </div>
</section>
