<div class="register-page">
  <div class="register-page__content">
    <div class="register-page__form-container">
      <app-register-form
        (submitForm)="onSubmit($event)"
        (cancel)="onCancel()"
      />
    </div>

    <div class="register-page__image-container">
      <img
        src="assets/register-image.png"
        alt="Registro"
        class="register-page__image"
      />
    </div>
  </div>
</div>
