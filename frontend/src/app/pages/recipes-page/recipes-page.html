<main class="recipes-page">
  <!-- Hero Section con Breadcrumbs, Título y Buscador -->
  <app-recipes-hero
    [config]="{
      breadcrumbItems: breadcrumbItems,
      title: 'Recetas',
      searchPlaceholder: 'Buscar receta',
      onSearch: onSearch.bind(this),
      searchValue: searchQuery,
    }"
  ></app-recipes-hero>

  <div class="recipes-page__container">
    <aside class="recipes-page__filters">
      @for (filterGroup of filters; track filterGroup.title) {
        <div class="filter-group">
          <h3 class="filter-group__title">{{ filterGroup.title }}</h3>
          <div class="filter-group__options">
            @for (option of filterGroup.options; track option.id; let i = $index) {
              <app-form-checkbox
                [label]="option.label"
                [name]="option.id"
                [(ngModel)]="option.checked"
                (checkboxChange)="onFilterChange($index, i)"
              />
            }
          </div>
        </div>
      }
    </aside>

    <div class="recipes-page__content">
      <div class="recipes-page__list">
        @for (recipe of recipes; track recipe.id) {
          <app-card
            variant="horizontal"
            [title]="recipe.title"
            [imageUrl]="recipe.imageUrl"
            [rating]="recipe.rating"
            actionText="Ver receta"
            (actionClick)="onViewRecipe(recipe.id)"
            (saveClick)="onSaveRecipe(recipe.id)"
          />
        }
      </div>

      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChanged)="onPageChange($event)"
        class="recipes-page__pagination"
      />
    </div>
  </div>
</main>
