<div class="dashboard">

  <app-sidebar
    [isCollapsed]="sidebarCollapsed"
    [items]="sidebarItems"
    (toggle)="toggleSidebar()"
    (itemClick)="onNavItemClick($event)">
  </app-sidebar>

  <main class="dashboard__content" [class.dashboard__content--sidebar-collapsed]="sidebarCollapsed">
    <div class="dashboard__bg-pattern"></div>

    <section class="dashboard__section dashboard__meals">
      @for (meal of todayMeals; track meal.id; let isFirst = $first) {
        <app-meal-card
          [time]="meal.time"
          [title]="meal.title"
          [imageUrl]="meal.imageUrl"
          [rating]="meal.rating"
          [tags]="meal.tags"
          [isPrimary]="isFirst"
          (viewRecipe)="onViewRecipe(meal.id)"
        />
      }
    </section>

    <section class="dashboard__section dashboard__pending">
      <div class="dashboard__section-header">
        <h2 class="dashboard__section-title">¡Tienes acciones pendientes!</h2>
      </div>

      <div class="dashboard__carousel">
        <div
          class="dashboard__carousel-track"
          [style.transform]="getCarouselTransform()">
          @for (product of visiblePendingProducts; track product.id) {
            <div class="dashboard__carousel-slide">
              <app-pending-product
                [name]="product.name"
                [urgency]="product.urgency"
                [daysRemaining]="product.daysRemaining"
                [color]="product.color"
                (markDone)="onMarkProductDone(product.id)">
              </app-pending-product>
            </div>
          }
        </div>
      </div>
    </section>

    <section class="dashboard__section dashboard__shopping">
      <div class="dashboard__section-header">
        <h2 class="dashboard__section-title">Tu lista de la compra</h2>
      </div>

      <div class="dashboard__search">
        <app-form-input
          type="text"
          placeholder="Buscar ingrediente..."
          icon="search"
          variant="search"
          [(ngModel)]="searchQuery"
          (inputChange)="onSearch()"
          class="dashboard__search-input form-input--search"
        />
      </div>

      <div class="dashboard__shopping-grid">
        @for (item of filteredShoppingList; track item.id) {
          <app-shopping-item
            [name]="item.name"
            [quantity]="item.quantity"
            [imageUrl]="item.imageUrl"
          />
        }
      </div>

      <div class="dashboard__shopping-actions">
        <app-button
          variant="secondary"
          size="md"
          icon="plus"
          (buttonClick)="onAddProduct()">
          Añadir producto
        </app-button>
      </div>
    </section>
  </main>
</div>
