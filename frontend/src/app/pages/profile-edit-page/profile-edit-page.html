<div class="profile-edit-page">
  <div class="profile-edit-page__container">
    <h1 class="profile-edit-page__title">Editar Perfil</h1>

    <form [formGroup]="form" class="profile-edit-page__form">
      <div class="profile-edit-page__field">
        <label for="name">Nombre</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="Tu nombre"
        />
      </div>

      <div class="profile-edit-page__field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@email.com"
        />
      </div>

      <div class="profile-edit-page__field">
        <label for="bio">Biografía</label>
        <textarea
          id="bio"
          formControlName="bio"
          placeholder="Cuéntanos sobre ti..."
          rows="4"
        ></textarea>
      </div>

      <div class="profile-edit-page__actions">
        <button type="button" (click)="onCancel()">
          Cancelar
        </button>
        <button
          type="button"
          (click)="onSave()"
          [disabled]="form.invalid"
        >
          Guardar Cambios
        </button>
      </div>
    </form>

    <p class="profile-edit-page__info" *ngIf="form.dirty">
      ℹ️ Tienes cambios sin guardar. Si intentas salir, se te pedirá confirmación.
    </p>
  </div>
</div>
