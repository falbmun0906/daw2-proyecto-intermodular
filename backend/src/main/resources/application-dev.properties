spring.application.name=backend

# Neon PostgreSQL Serverless Database Configuration
# Obtener credenciales desde: https://console.neon.tech
spring.datasource.url=${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/despiensa}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${NEON_DB_USER:postgres}
spring.datasource.password=${NEON_DB_PASSWORD:postgres}

# SSL Configuration for Neon (required in production)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:prefer}

# Connection Pool Configuration optimized for Neon
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:esta_es_una_clave_de_desarrollo_muy_larga_que_debes_cambiar_en_produccion_12345678}
jwt.expiration=86400000

# Logging
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=INFO