version: '3.8'

# ===============================================
# CONFIGURACIÓN OPCIONAL - PostgreSQL Local
# ===============================================
# Este docker-compose es una ALTERNATIVA OPCIONAL a Neon.
# El proyecto está configurado para usar Neon PostgreSQL Serverless por defecto.
#
# ¿Cuándo usar esto?
# - Solo si NO quieres usar Neon
# - Si necesitas desarrollo offline
# - Si prefieres tener PostgreSQL local
#
# Para usar NEON (RECOMENDADO - más fácil):
# 1. Crea una cuenta en https://neon.tech (gratis)
# 2. Configura las variables de entorno en .env
# 3. Ejecuta: ./mvnw spring-boot:run
# 4. ¡Listo! (sin Docker, sin instalaciones)
#
# Para usar DOCKER LOCAL (esta configuración):
# 1. Instala Docker Desktop
# 2. Ejecuta: docker-compose up -d
# 3. Configura .env con localhost:5432
# 4. Consulta DOCKER_LOCAL_SETUP.md para más detalles
# ===============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: despiensa_postgres
    environment:
      POSTGRES_DB: despiensa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - despiensa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.0
    container_name: despiensa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - despiensa_network

volumes:
  postgres_data:

networks:
  despiensa_network:
    driver: bridge

